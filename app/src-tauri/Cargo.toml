[package]
name = "zhulinniao-hub"
version = "1.2.2"
description = "竹林鸟朱雀耳机 Hub（CM002X1）— 原版驱动 UI 重置版"
edition = "2021"
default-run = "zhulinniao-hub"

[lib]
name = "zhulinniao_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"
winreg = "0.52"

[target.'cfg(windows)'.dependencies]
# 用于关闭 WebView2 的浏览器原生右键菜单（刷新/检查/另存为…），让窗口表现得像原生软件
webview2-com = "0.39"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Apo",
    "Win32_Media_Audio_Endpoints",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>空间音频 · 朱雀耳机 Hub</title>
  <link rel="stylesheet" href="assets/design-tokens.css">
  <link rel="stylesheet" href="assets/prototype.css">
</head>
<body data-page="spatial">
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <span class="sidebar__mark" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/></svg>
        </span>
        <div>
          <div class="sidebar__title">朱雀耳机 Hub</div>
          <div class="sidebar__sub">CM002X1 · 竹林鸟</div>
        </div>
      </div>
      <nav class="nav" aria-label="主导航">
        <div class="nav__label">功能</div>
        <a class="nav-item" href="overview.html" data-nav="overview"><i data-lucide="layout-dashboard"></i><span>概览</span></a>
        <a class="nav-item" href="sound.html" data-nav="sound"><i data-lucide="sliders-horizontal"></i><span>音效</span></a>
        <a class="nav-item" href="spatial.html" data-nav="spatial"><i data-lucide="move-3d"></i><span>空间音频</span></a>
        <a class="nav-item" href="mic.html" data-nav="mic"><i data-lucide="mic"></i><span>麦克风</span></a>
        <a class="nav-item" href="hearing.html" data-nav="hearing"><i data-lucide="ear"></i><span>助听</span></a>
        <a class="nav-item" href="lighting.html" data-nav="lighting"><i data-lucide="lightbulb"></i><span>灯光</span></a>
        <a class="nav-item" href="device.html" data-nav="device"><i data-lucide="settings-2"></i><span>设备与设置</span></a>
      </nav>
      <div class="sidebar__foot">
        <a class="nav-item" href="#feedback"><i data-lucide="message-square-text"></i><span>问题反馈</span></a>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-toggle" aria-label="展开导航" aria-expanded="false"><i data-lucide="menu"></i></button>
        <span class="topbar__crumbs">空间音频 · 头动追踪与声场</span>
        <span class="topbar__spacer"></span>
        <a class="btn btn--secondary" href="#library"><i data-lucide="folder-cog"></i>配置库</a>
        <button class="icon-btn" aria-label="搜索"><i data-lucide="search"></i></button>
        <button class="icon-btn" aria-label="更多"><i data-lucide="ellipsis-vertical"></i></button>
      </header>

      <main class="canvas">
        <div class="page-head">
          <div class="page-head__text">
            <h1 class="page-title">空间音频</h1>
            <p class="page-desc">虚拟 7.1 声场与头部朝向追踪。</p>
          </div>
          <div class="page-head__actions">
            <label class="switch">
              <input type="checkbox" checked aria-label="头动追踪开关">
              <span class="switch__track switch__track--accent"></span>
            </label>
            <span class="inline-status inline-status--ok"><i data-lucide="circle-check"></i>头动追踪已开启</span>
          </div>
        </div>

        <div class="inline-status inline-status--warn" style="margin-bottom:var(--space-5)">
          <i data-lucide="triangle-alert"></i>尚未校准，当前朝向为上次记录值
          <button class="btn btn--secondary" style="margin-left:auto;height:32px"><i data-lucide="crosshair"></i>开始校准</button>
        </div>

        <div class="work">
          <section class="panel">
            <div class="panel__head">
              <h2 class="panel__title">虚拟扬声器布局</h2>
              <span class="pill">7.1 声道</span>
            </div>
            <div class="spatial-stage">
              <svg viewBox="0 0 400 400" role="img" aria-label="7.1 虚拟扬声器俯视图，听者位于中心">
                <circle class="listener-ring" cx="200" cy="200" r="150"></circle>
                <circle class="listener-ring" cx="200" cy="200" r="90"></circle>
                <!-- 8 speakers around listener -->
                <g class="speaker-node is-active" transform="translate(200,40)"><circle r="16"></circle><text text-anchor="middle" y="32">前置左</text></g>
                <g class="speaker-node is-active" transform="translate(200,70)"><circle r="16"></circle><text text-anchor="middle" y="32">中置</text></g>
                <g class="speaker-node" transform="translate(330,90)"><circle r="16"></circle><text text-anchor="middle" x="26" y="4">右前</text></g>
                <g class="speaker-node is-active" transform="translate(350,200)"><circle r="16"></circle><text text-anchor="middle" x="30" y="4">右环绕</text></g>
                <g class="speaker-node" transform="translate(330,310)"><circle r="16"></circle><text text-anchor="middle" x="26" y="4">右后</text></g>
                <g class="speaker-node" transform="translate(200,340)"><circle r="16"></circle><text text-anchor="middle" y="-22">后环绕</text></g>
                <g class="speaker-node" transform="translate(70,310)"><circle r="16"></circle><text text-anchor="middle" x="-28" y="4">左后</text></g>
                <g class="speaker-node is-active" transform="translate(50,200)"><circle r="16"></circle><text text-anchor="middle" x="-30" y="4">左环绕</text></g>
                <!-- listener -->
                <circle class="listener" cx="200" cy="200" r="14"></circle>
                <text x="200" y="204" text-anchor="middle" font-size="9" font-family="var(--font-mono)" fill="var(--surface)">听者</text>
              </svg>
            </div>
            <p class="field__hint">拖拽听者头像可旋转朝向，扬声器增益随之更新；键盘 ←/→ 调整朝向。</p>
          </section>

          <section class="panel">
            <div class="field">
              <div class="field__row"><i data-lucide="layout-grid"></i><span class="field__label">声道模式</span></div>
              <div class="segmented" role="group" aria-label="声道模式">
                <button aria-pressed="false">立体声</button>
                <button aria-pressed="true">7.1</button>
              </div>
            </div>

            <hr class="divider">

            <div class="field">
              <div class="field__row">
                <i data-lucide="move-3d"></i>
                <span class="field__label">头动追踪</span>
                <span class="field__val mono">前置 -15°</span>
              </div>
              <div class="field__row" style="margin-bottom:var(--space-2)">
                <span class="field__label muted" style="font-weight:400">追踪灵敏度</span>
                <span class="field__val" data-slider-val>70%</span>
              </div>
              <div class="slider">
                <div class="slider__track"><div class="slider__fill" style="width:70%"></div></div>
                <input type="range" min="0" max="100" value="70" aria-label="头动追踪灵敏度">
                <span class="slider__thumb" style="left:70%"></span>
              </div>
            </div>

            <hr class="divider">

            <div class="field">
              <div class="field__row">
                <i data-lucide="maximize-2"></i>
                <span class="field__label">声场宽度</span>
                <span class="field__val" data-slider-val>120%</span>
              </div>
              <div class="slider">
                <div class="slider__track"><div class="slider__fill" style="width:60%"></div></div>
                <input type="range" min="0" max="200" value="120" aria-label="声场宽度" data-suffix="%">
                <span class="slider__thumb" style="left:60%"></span>
              </div>
            </div>

            <hr class="divider">

            <div class="field">
              <div class="field__row"><i data-lucide="warehouse"></i><span class="field__label">房间混响</span></div>
              <div class="segmented" role="group" aria-label="房间混响">
                <button aria-pressed="false">关闭</button>
                <button aria-pressed="true">客厅</button>
                <button aria-pressed="false">剧院</button>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
